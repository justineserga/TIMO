services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timo_admin_frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5175:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  node_modules:
